<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
    <title>Document</title>
    <style>
      .container {
        width: 100px;
        height: 100px;
        border: 1px solid;
        animation-name: "test";
        animation-duration: 1s;
        /* animation-delay: 1s; */
        /* animation-iteration-count: 3; */
        /* animation-iteration-count: infinite; */
        position: relative;
        /* animation-direction: alternate; */
        /* animation-direction: reverse; */
        /* animation-direction: alternate-reverse; */
        /* animation-timing-function: ease; */
        /* animation-timing-function: ease-in; */
        /* animation-timing-function: ease-out; */
        /* animation-timing-function: ease-in-out; */
      }

      @keyframes test {
        from {
          transform: rotate(0deg);
          left: 0px;
        }
        to {
          transform: rotate(360deg);
          left: 400px;
          border-radius: 50%;
        }
      }

      .parent {
        width: 600px;
        height: 600px;
        border: 1px solid;
        position: relative;
      }
      .child {
        width: 100px;
        height: 100px;
        border: 1px solid;
        background-color: rebeccapurple;
        position: absolute;
        animation-name: "circle";
        animation-duration: 2s;
        animation-direction: alternate;
        animation-iteration-count: infinite;
      }

      @keyframes circle {
        0% {
          top: 0px;
          left: 0px;
        }
        25% {
          top: 0px;
          left: 400px; /* Moves to top-right */
        }
        50% {
          top: 400px; /* Moves to bottom-right */
          left: 400px;
        }
        75% {
          top: 400px;
          left: 0px; /* Moves to bottom-left */
        }
        100% {
          top: 0px;
          left: 0px; /* Returns to top-left */
        }
      }
    </style>
  </head>
  <body>
    <!-- <div class="container"></div> -->
    <!-- <div class="parent">
      <div class="child"></div>
    </div> -->
    <p class="animate__animated animate__zoomOutRight">
      Lorem ipsum dolor sit.
    </p>
    <p class="animate__animated animate__shakeY">Lorem ipsum dolor sit.</p>
  </body>
</html>
