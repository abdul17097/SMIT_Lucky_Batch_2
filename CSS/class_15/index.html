<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .card {
        width: 200px;
        height: 200px;
        border: 1px solid;
        display: inline-block;
        position: absolute;
      }
      .card1 {
        z-index: 1;
        margin-left: 50px;
      }
      .card2 {
        z-index: 5;
        margin-left: 100px;
      }
      .card3 {
        z-index: 3;
        margin-left: 150px;
      }
      .card4 {
        z-index: 4;
        margin-left: 200px;
      }
    </style>
  </head>
  <body>
    <div class="">
      <div style="background-color: red" class="card card1"></div>
      <div style="background-color: blue" class="card card2"></div>
      <div style="background-color: green" class="card card3"></div>
      <div style="background-color: black" class="card card4"></div>
    </div>
  </body>
</html>
