<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      form {
        border: 1px solid;
        width: 30%;
        margin: auto;
        margin-top: 50px;
        padding: 50px 30px;
        border-radius: 10px;
        /* height: 300px; */
      }
      label,
      input {
        display: block;
        width: 100%;
        border-radius: 10px;
        outline: none;
      }
      label {
        font-size: 24px;
        margin-bottom: 5px;
      }
      input:focus {
        outline: none;
      }
      input[type="email"],
      input[type="password"] {
        padding: 10px 10px;
        box-sizing: border-box;
        font-size: 20px;
        margin-bottom: 25px;
        border: 1px solid rgb(88, 88, 36);
      }

      input[type="submit"] {
        padding: 10px 6px;
        box-sizing: border-box;
        font-size: 20px;
        margin-top: 60px;
        border: 1px solid rgb(88, 88, 36);
        background-color: #1abc9c;
        color: white;
      }
      input[type="submit"]:hover {
        background-color: #22d8b4;
      }
    </style>
  </head>
  <body>
    <form action="">
      <h2 style="text-align: center; font-size: 32px; color: #1abc9c">
        Login Form
      </h2>
      <label for="">Email:</label>
      <input type="email" />
      <label for="">Password</label>
      <input type="password" />
      <input type="submit" value="Login" />
    </form>
  </body>
</html>
