<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }
      form {
        border: 1px solid;
        width: 30%;
        margin: auto;
        margin-top: 50px;
        padding: 50px 30px;
        border-radius: 10px;
        /* height: 300px; */
      }
      label {
        display: block;
        width: 100%;
        border-radius: 10px;
        outline: none;
      }

      label {
        font-size: 24px;
        margin-bottom: 5px;
      }
      input:focus {
        outline: none;
      }
      input[type="email"],
      input[type="password"] {
        padding: 10px 10px;
        box-sizing: border-box;
        font-size: 20px;
        display: inline-block;
        width: calc(100% - 40px);
        /* margin-bottom: 25px; */
        /* border: 1px solid rgb(88, 88, 36); */
        border: none;
      }

      input[type="submit"] {
        padding: 10px 6px;
        box-sizing: border-box;
        font-size: 20px;
        margin-top: 60px;
        border: 1px solid rgb(88, 88, 36);
        background-color: #1abc9c;
        color: white;
        border-radius: 10px;
        width: 100%;
      }
      input[type="submit"]:hover {
        background-color: #22d8b4;
      }
      .form_group {
        width: 100%;
        border: 1px solid;
        padding: 0px 10px;
        border-radius: 10px;
      }
      .form_group > img {
        width: 25px;
        height: 25px;
        /* border: 1px solid; */
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <form action="">
      <h2 style="text-align: center; font-size: 32px; color: #1abc9c">
        Login Form
      </h2>
      <label for="">Email:</label>
      <div class="form_group">
        <img src="../images/email.png" alt="" />
        <input type="email" />
      </div>
      <label for="">Password</label>
      <div class="form_group">
        <img src="../images/password.png" alt="" />
        <input type="password" />
      </div>
      <input type="submit" value="Login" />
    </form>
  </body>
</html>
