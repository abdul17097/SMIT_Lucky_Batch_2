<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }
      .product {
        width: 150px;
        height: 150px;
        border: 1px solid;
        background-color: white;
        display: inline-block;
      }
      .card {
        width: 150px;
        height: 150px;
        border: 1px solid;
        background-color: white;
        display: inline-block;
      }
      .product3 {
        /* position: absolute; */
        /* top: 50px; */
        /* bottom: 100px; */
      }
      .parent {
        height: 500px;
        border: 1px solid;
        position: relative;
      }
      .card2 {
        position: absolute;
        bottom: 40px;
      }
      .product_card {
        border: 1px solid;
        box-shadow: 5px 5px 10px;
        width: 400px;
        position: relative;
      }
      .product_card > img {
        width: 100%;
        /* height: 100%; */
      }
      #eyeicon {
        width: 50px;

        height: 50px;
        border-radius: 50%;
        border: 1px solid;
        /* position: relative; */
        /* bottom: 300px; */
        /* position: fixed; */
        position: absolute;
        top: 30px;
        right: 30px;
      }
    </style>
  </head>
  <body>
    <!-- <div class="product1 product">one</div>
    <div class="product2 product">two</div>
    <div class="product3 product">three</div>
    <div class="product4 product">four</div>
    <div class="product5 product">five</div> -->

    <div class="parent">
      <div class="card1 card">one</div>
      <div class="card2 card">two</div>
      <div class="card3 card">three</div>
      <div class="card4 card">four</div>
      <div class="card5 card">five</div>
    </div>

    <div class="product_card">
      <img src="../images/images.jpg" alt="" />
      <img src="../images/password.png" id="eyeicon" alt="" />
    </div>
  </body>
</html>
